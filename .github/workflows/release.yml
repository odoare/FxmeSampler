name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Lets the three builds (and the macOS verification) be exercised by hand
  # without publishing anything. The release job below is gated on a tag.
  workflow_dispatch:

jobs:
  # ── Linux x86_64 ──────────────────────────────────────────────────────────
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - uses: actions/checkout@v4
        with:
          path: FxmeSampler
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Configure & Build
        run: |
          cmake -B FxmeSampler/build -S FxmeSampler -DCMAKE_BUILD_TYPE=Release
          # Build the large BinaryData targets one at a time to avoid OOM.
          cmake --build FxmeSampler/build --config Release --target BlackWidowDrumsBinaryData --parallel 1
          cmake --build FxmeSampler/build --config Release --target CenturyDrumsBinaryData   --parallel 1
          # BinaryData is cached; build the rest (capped at 2 to stay within 16 GB RAM).
          cmake --build FxmeSampler/build --config Release --parallel 2

      - name: Package
        run: |
          mkdir -p vst3_staging
          cp -r "FxmeSampler/build/Kits/BlackWidow/BlackWidowDrums_artefacts/Release/VST3/Black Widow Drums.vst3" vst3_staging/
          cp -r "FxmeSampler/build/Kits/Century/CenturyDrums_artefacts/Release/VST3/CenturyDrums.vst3" vst3_staging/
          zip -r ${{ github.workspace }}/FxmeSampler-VST3-Linux-x86_64.zip vst3_staging/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: FxmeSampler-VST3-Linux-x86_64.zip

  # ── Windows x86_64 ────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: FxmeSampler
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Configure & Build
        run: |
          cmake -B FxmeSampler/build -S FxmeSampler -G "Visual Studio 17 2022"
          # Build the large BinaryData targets one at a time to avoid OOM.
          cmake --build FxmeSampler/build --config Release --target BlackWidowDrumsBinaryData --parallel 1
          cmake --build FxmeSampler/build --config Release --target CenturyDrumsBinaryData   --parallel 1
          # BinaryData is cached; build the rest in full parallel.
          cmake --build FxmeSampler/build --config Release --parallel

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installers
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          # A workflow_dispatch run has no tag, so ref_name is a branch name.
          [[ "$VERSION" =~ ^[0-9] ]] || VERSION="1.0.0"
          NSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          PKG_DIR="${{ github.workspace }}/FxmeSampler/packaging/windows"
          BUILD_DIR="${{ github.workspace }}/FxmeSampler/build"

          # Black Widow Drums
          cp -r "$BUILD_DIR/Kits/BlackWidow/BlackWidowDrums_artefacts/Release/VST3/Black Widow Drums.vst3" "$PKG_DIR/"
          pushd "$PKG_DIR"
          "$NSIS" -DAPPNAME="Black Widow Drums" -DSLUGNAME=BlackWidowDrums "-DPLUGFILE=Black Widow Drums.vst3" -DVERSION="$VERSION" installer.nsi
          rm -rf "Black Widow Drums.vst3"
          popd

          # Century Drums
          cp -r "$BUILD_DIR/Kits/Century/CenturyDrums_artefacts/Release/VST3/CenturyDrums.vst3" "$PKG_DIR/"
          pushd "$PKG_DIR"
          "$NSIS" -DAPPNAME=CenturyDrums -DSLUGNAME=CenturyDrums -DPLUGFILE=CenturyDrums.vst3 -DVERSION="$VERSION" installer.nsi
          popd

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            FxmeSampler/packaging/windows/BlackWidowDrums-Windows-Setup.exe
            FxmeSampler/packaging/windows/CenturyDrums-Windows-Setup.exe

  # ── macOS universal (arm64 + x86_64) ──────────────────────────────────────
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: FxmeSampler
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Configure & Build
        run: |
          # The architecture/deployment settings are passed here as well as in
          # CMakeLists.txt: a command-line -D lands in the cache before any
          # CMakeLists line runs, so it cannot be lost to file ordering.
          cmake -B FxmeSampler/build -S FxmeSampler \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          # Build the large BinaryData targets one at a time to avoid OOM.
          cmake --build FxmeSampler/build --config Release --target BlackWidowDrumsBinaryData --parallel 1
          cmake --build FxmeSampler/build --config Release --target CenturyDrumsBinaryData   --parallel 1
          # BinaryData is cached; build capped at 2 (7 GB RAM + universal binary overhead).
          cmake --build FxmeSampler/build --config Release --parallel 2

      # This step must be able to fail. `lipo -info` printing "arm64" while the
      # job goes green is exactly how an arm64-only release ships.
      - name: Verify universal binaries
        run: |
          set -uo pipefail
          BW="FxmeSampler/build/Kits/BlackWidow/BlackWidowDrums_artefacts/Release"
          CT="FxmeSampler/build/Kits/Century/CenturyDrums_artefacts/Release"
          status=0
          for bundle in \
            "$BW/VST3/Black Widow Drums.vst3/Contents/MacOS/Black Widow Drums" \
            "$BW/AU/Black Widow Drums.component/Contents/MacOS/Black Widow Drums" \
            "$BW/Standalone/Black Widow Drums.app/Contents/MacOS/Black Widow Drums" \
            "$CT/VST3/CenturyDrums.vst3/Contents/MacOS/CenturyDrums" \
            "$CT/AU/CenturyDrums.component/Contents/MacOS/CenturyDrums" \
            "$CT/Standalone/CenturyDrums.app/Contents/MacOS/CenturyDrums"
          do
            if [[ ! -f "$bundle" ]]; then
              echo "::error::missing binary: $bundle"; status=1; continue
            fi
            info=$(lipo -info "$bundle")
            echo "$info"
            for arch in x86_64 arm64; do
              grep -qw "$arch" <<< "$info" \
                || { echo "::error::$bundle has no $arch slice"; status=1; }
            done
            vtool -show-build "$bundle" | grep -E 'minos|platform' || true
          done
          exit $status

      # Ad-hoc signature: free, no Apple account. It only makes the bundle
      # internally consistent (arm64 code needs *some* signature to run, and
      # packaging steps can invalidate the linker's). It is NOT notarisation
      # and does nothing for Gatekeeper — see the README on quarantine.
      - name: Ad-hoc codesign
        run: |
          set -euo pipefail
          BW="FxmeSampler/build/Kits/BlackWidow/BlackWidowDrums_artefacts/Release"
          CT="FxmeSampler/build/Kits/Century/CenturyDrums_artefacts/Release"
          for b in \
            "$BW/VST3/Black Widow Drums.vst3" \
            "$BW/AU/Black Widow Drums.component" \
            "$BW/Standalone/Black Widow Drums.app" \
            "$CT/VST3/CenturyDrums.vst3" \
            "$CT/AU/CenturyDrums.component" \
            "$CT/Standalone/CenturyDrums.app"
          do
            codesign --force --deep --sign - --timestamp=none "$b"
            codesign --verify --verbose "$b"
          done

      - name: Build pkg installer
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          # A workflow_dispatch run has no tag, so ref_name is a branch name.
          # Keep this fallback in step with project(... VERSION ...) in CMakeLists.txt.
          [[ "$VERSION" =~ ^[0-9] ]] || VERSION="1.0.0"
          mkdir -p pkg_root/Library/Audio/Plug-Ins/VST3
          mkdir -p pkg_root/Library/Audio/Plug-Ins/Components
          cp -r "FxmeSampler/build/Kits/BlackWidow/BlackWidowDrums_artefacts/Release/VST3/Black Widow Drums.vst3" \
                "pkg_root/Library/Audio/Plug-Ins/VST3/"
          cp -r "FxmeSampler/build/Kits/Century/CenturyDrums_artefacts/Release/VST3/CenturyDrums.vst3" \
                "pkg_root/Library/Audio/Plug-Ins/VST3/"
          cp -r "FxmeSampler/build/Kits/BlackWidow/BlackWidowDrums_artefacts/Release/AU/Black Widow Drums.component" \
                "pkg_root/Library/Audio/Plug-Ins/Components/"
          cp -r "FxmeSampler/build/Kits/Century/CenturyDrums_artefacts/Release/AU/CenturyDrums.component" \
                "pkg_root/Library/Audio/Plug-Ins/Components/"
          pkgbuild \
            --root pkg_root \
            --identifier com.fxmechanics.FxmeSampler \
            --version "$VERSION" \
            --install-location / \
            FxmeSampler-macOS.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: FxmeSampler-macOS.pkg

      - name: Package VST3 and AU zips
        run: |
          mkdir -p vst3_staging au_staging
          cp -r "FxmeSampler/build/Kits/BlackWidow/BlackWidowDrums_artefacts/Release/VST3/Black Widow Drums.vst3" vst3_staging/
          cp -r "FxmeSampler/build/Kits/Century/CenturyDrums_artefacts/Release/VST3/CenturyDrums.vst3" vst3_staging/
          cp -r "FxmeSampler/build/Kits/BlackWidow/BlackWidowDrums_artefacts/Release/AU/Black Widow Drums.component" au_staging/
          cp -r "FxmeSampler/build/Kits/Century/CenturyDrums_artefacts/Release/AU/CenturyDrums.component" au_staging/
          zip -r ${{ github.workspace }}/FxmeSampler-VST3-macOS-universal.zip vst3_staging/
          zip -r ${{ github.workspace }}/FxmeSampler-AU-macOS-universal.zip au_staging/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-vst3
          path: FxmeSampler-VST3-macOS-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-au
          path: FxmeSampler-AU-macOS-universal.zip

  # ── Publish GitHub Release ────────────────────────────────────────────────
  release:
    needs: [build-linux-x86_64, build-windows, build-macos]
    # Only publish for a real tag; workflow_dispatch runs stop after the builds.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.pkg
            artifacts/*.exe
          generate_release_notes: true
